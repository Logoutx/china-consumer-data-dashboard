# field_map.yaml -- source vocabulary -> canonical series id (DATA-CONTRACT §11.1).
#
# Keyed by ParsedRelease.source, then by ParsedRow.source_field (the raw Chinese
# label a parser read off the release page). The *measure* for each row is NOT
# looked up here -- it travels directly on the row as `caliber_hint`, already one
# of the six observation measure names (m/m_yoy/ytd/ytd_yoy/mom/real_yoy). See the
# "caliber_hint" design note in pipeline/__init__.py for why.
#
# RECONCILED 2026-07-08 against the real data/catalog.json (105 series) and the
# three parsers' actual output (pipeline/parsers/{nbs_cpi,nbs_retail,pboc_money}.py,
# run against their committed fixtures under pipeline/fixtures/raw/). Every id below
# is a real, catalog-scaffolded id with a matching data/series/<id>.json file on
# disk -- confirmed by staging each fixture end-to-end (see docs/OPERATIONS.md /
# this reconciliation's own report for the staged-diff proof).
#
# A source_field the parser emits but with NO matching catalog series is commented
# out below rather than deleted outright -- each has a one-line reason. Nothing is
# lost: an unmapped field lands in stage_result.unmapped_fields (runner.py prints
# it as "add to pipeline/config/field_map.yaml"), a soft, expected signal, not an
# error. Uncomment + point at a real id once/if the catalog grows to cover it.

nbs-cpi:
  居民消费价格: nbs-cpi-yoy
  非食品: nbs-cpi-nonfood-yoy
  消费品: nbs-cpi-goods-yoy
  服务: nbs-cpi-services-yoy
  不包括食品和能源: nbs-cpi-core-yoy
  # 一、食品烟酒及在外餐饮 (the CATEGORY row) is the one catalog tracks under
  # nbs-cpi-food-yoy ("食品烟酒及在外餐饮类居民消费价格指数") -- NOT the bare
  # "食品" summary row below, which is a narrower, different concept (food only,
  # excl. tobacco/alcohol/dining out) with no catalog series of its own.
  食品烟酒及在外餐饮: nbs-cpi-food-yoy

  # -- no catalog series for these; catalog's "prices" section only tracks the
  #    headline + 5 named breakdowns above (core/food-tobacco-dining/goods/
  #    nonfood/services), not urban/rural or the other 7 of 8 top-level
  #    categories. The expenditure side (income-confidence section,
  #    nbs-consumption-clothing/housing/healthcare/...) already covers those
  #    category names from a different survey (CNY spend, not a price index) --
  #    do not conflate the two even though the Chinese labels match.
  # 城市: (no catalog series -- urban-only CPI not tracked)
  # 农村: (no catalog series -- rural-only CPI not tracked)
  # 食品: (no catalog series -- bare "food" CPI not tracked; see 食品烟酒及在外餐饮 above)
  # 衣着: (no catalog series -- CPI category not tracked; nbs-consumption-clothing is EXPENDITURE, a different concept)
  # 居住: (no catalog series -- CPI category not tracked; nbs-consumption-housing is EXPENDITURE, a different concept)
  # 生活用品及服务: (no catalog series -- CPI category not tracked; nbs-consumption-household-services is EXPENDITURE, a different concept)
  # 交通通信: (no catalog series -- CPI category not tracked; nbs-consumption-transport-communication is EXPENDITURE, a different concept)
  # 教育文化娱乐: (no catalog series -- CPI category not tracked; nbs-consumption-education-culture is EXPENDITURE, a different concept)
  # 医疗保健: (no catalog series -- CPI category not tracked; nbs-consumption-healthcare is EXPENDITURE, a different concept)
  # 其他用品及服务: (no catalog series -- CPI category not tracked; nbs-consumption-other is EXPENDITURE, a different concept)

nbs-retail:
  社会消费品零售总额: nbs-retail-total
  除汽车以外的消费品零售额: nbs-retail-ex-auto
  限额以上单位消费品零售额: nbs-retail-above-quota
  网上商品零售额: nbs-retail-online-goods
  城镇: nbs-retail-urban
  乡村: nbs-retail-rural
  餐饮收入: nbs-retail-catering
  限额以上单位餐饮收入: nbs-retail-above-quota-catering
  商品零售额: nbs-retail-goods
  限额以上单位商品零售额: nbs-retail-above-quota-goods
  粮油、食品类: nbs-retail-cat-grain-food
  饮料类: nbs-retail-cat-beverage
  烟酒类: nbs-retail-cat-tobacco-alcohol
  服装、鞋帽、针纺织品类: nbs-retail-cat-garments
  化妆品类: nbs-retail-cat-cosmetics
  金银珠宝类: nbs-retail-cat-gold-jewelry
  日用品类: nbs-retail-cat-daily-goods
  体育、娱乐用品类: nbs-retail-cat-sports-entertainment
  家用电器和音像器材类: nbs-retail-cat-household-appliances
  中西药品类: nbs-retail-cat-medicine
  文化办公用品类: nbs-retail-cat-cultural-office
  家具类: nbs-retail-cat-furniture
  通讯器材类: nbs-retail-cat-communication
  石油及制品类: nbs-retail-cat-petroleum
  # "汽车类" is the above-quota commodity-category table's own auto row --
  # catalog's dedicated id for it is nbs-retail-auto (group "汽车拆分"), not a
  # "-cat-auto" placeholder; it is a DIFFERENT id from nbs-retail-ex-auto
  # (which is the *complement*, "everything except cars").
  汽车类: nbs-retail-auto
  建筑及装潢材料类: nbs-retail-cat-building-materials

  # -- no catalog series for these:
  # 网上商品和服务零售额: (no catalog series -- the new, broader combined goods+services
  #   online total post-2026-relabeling (DATA-CONTRACT §2.1); catalog kept tracking
  #   only the narrower goods-only concept under nbs-retail-online-goods, both
  #   before and after the relabeling)
  # 网上服务零售额: (no catalog series -- the new services-only online split; not yet scaffolded)
  # 书报杂志类: (no catalog series; also absent from this month's own release table --
  #   see pipeline/parsers/nbs_retail.py's module docstring)

pbc-money:
  M2: pbc-m2
  M1: pbc-m1
  M0: pbc-m0

  # -- no catalog series for these: data/catalog.json's "money-credit" section
  #    only scaffolds M0/M1/M2 (the headline money-supply aggregates). None of
  #    the TSF (社会融资规模) or loan/deposit stock+flow figures this parser
  #    also extracts from the same release have a catalog id anywhere in the
  #    105-series catalog today (confirmed by full-catalog search, not just
  #    the money-credit section -- they are not hiding under a different
  #    section/id either).
  # 社会融资规模存量: (no catalog series)
  # 社会融资规模增量: (no catalog series)
  # 对实体经济发放的人民币贷款余额: (no catalog series)
  # 对实体经济发放的人民币贷款增加: (no catalog series)
  # 人民币贷款余额: (no catalog series)
  # 人民币贷款增加: (no catalog series)
  # 人民币存款余额: (no catalog series)
  # 人民币存款增加: (no catalog series)
  # 本外币存款余额: (no catalog series)
  # 本外币贷款余额: (no catalog series)
  # 住户存款增加: (no catalog series)
  # 住户贷款增加: (no catalog series)

spb-express:
  # 国家邮政局 邮政行业运行情况 bulletins (MOT mirror) -- prose releases, see
  # pipeline/parsers/spb_express.py. Only the two headline express concepts
  # are extracted; the 同城/异地/国际 splits and the 邮政行业(寄递)业务 totals
  # in the same prose are never emitted by the parser (no catalog series).
  快递业务量: spb-express-volume
  快递业务收入: spb-express-revenue
