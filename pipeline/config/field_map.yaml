# field_map.yaml -- source vocabulary -> canonical series id (DATA-CONTRACT §11.1).
#
# Keyed by ParsedRelease.source, then by ParsedRow.source_field (the raw Chinese
# label a parser read off the release page). The *measure* for each row is NOT
# looked up here -- it travels directly on the row as `caliber_hint`, already one
# of the six observation measure names (m/m_yoy/ytd/ytd_yoy/mom/real_yoy). See the
# "caliber_hint" design note in pipeline/__init__.py for why.
#
# PLACEHOLDER IDS: the real catalog (data/catalog.json, data/series/*.json) is being
# built concurrently by another agent in this same rebuild. The ids below are
# reasonable, contract-shaped (agency-slug[-qualifier]) guesses so this pipeline is
# runnable and testable end-to-end today -- they are NOT guaranteed to match
# whatever ids the real catalog ultimately mints. Reconcile before pointing
# normalize.py at the real data/series/ tree.

nbs-cpi:
  居民消费价格: nbs-cpi
  城市: nbs-cpi-urban
  农村: nbs-cpi-rural
  食品: nbs-cpi-food
  非食品: nbs-cpi-nonfood
  消费品: nbs-cpi-goods
  服务: nbs-cpi-services
  不包括食品和能源: nbs-cpi-core
  食品烟酒及在外餐饮: nbs-cpi-cat-food-tobacco
  衣着: nbs-cpi-cat-clothing
  居住: nbs-cpi-cat-housing
  生活用品及服务: nbs-cpi-cat-household-goods
  交通通信: nbs-cpi-cat-transport-comm
  教育文化娱乐: nbs-cpi-cat-education-culture
  医疗保健: nbs-cpi-cat-health
  其他用品及服务: nbs-cpi-cat-other

