# pipeline/audit/labels.yaml — hand-curated series_id -> Chinese label table.
#
# Used by gate_b.archive_independent_sample / gate_b.dg_archive_sample for the
# flat-text fuzzy scan (kernel.source_contains_value) and the DG indicator-name
# candidate search (dg_archive.find_candidate_indicator_ids): `label_zh` (and,
# when present, `alt_labels`, tried in order after label_zh fails) is the
# substring searched for near a sampled value in archived raw text.
#
# Curation method: label_zh defaults to the catalog's own name_zh (data/
# catalog.json), then HAND-ADJUSTED wherever the real release prose uses a
# shorter or different substring — verified empirically against the 6 real
# archived pages committed at pipeline/fixtures/raw/*/ wherever one was
# available (CPI, PBOC money supply, PMI, income; see per-entry comments
# above the override block in the generator this file was produced from —
# preserved as comments below on every entry that deviates from name_zh).
# Series without an empirically-checked page keep name_zh verbatim, which is
# a reasonable default (retail/income/mof/pbc series all follow standard NBS/
# MOF/PBOC release phrasing) but is the first thing to re-verify as more
# archive coverage lands.
#
# Coverage: every catalog series (88 + the 70-city panel) has an entry here —
# this was practical given the catalog is small (~89 ids) and every name_zh
# was already at hand; it is still a hand-reviewed table, not a blind dump
# (28 of the 89 entries carry an explicit override; see git history / the
# generator script noted above for the reasoning on each). A series is only
# EVER reported as coverage="unverifiable" for a reason OTHER than "missing
# from this file" now — e.g. `no_source_text: true` (a derived series with no
# raw source to fuzzy-match; verified instead by gate_b.derived_recompute) or
# a genuine archive gap (no captured page/DG response covers the sampled
# period yet). If a series is later added to data/catalog.json without a
# matching entry landing here, checks/*.py treat it as coverage=unverifiable,
# WARN, not silent, per the task spec.
#
# Fields:
#   label_zh       primary Chinese substring to search for.
#   alt_labels     optional list of fallback substrings, tried in order.
#   unit           expected unit (informational; used in report output).
#   derived_rule   present iff this is a derived series (mirrors the
#                  catalog's derived.rule) -- informational cross-reference.
#   no_source_text true iff no raw source ever prints this value verbatim
#                  (our own coined aggregate, or a computed share/rate) --
#                  archive_independent_sample skips fuzzy-matching these and
#                  defers entirely to gate_b.derived_recompute.
#   note           free-text curation note.
